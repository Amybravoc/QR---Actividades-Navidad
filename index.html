<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Actividades de Davante · Inscripciones</title>
<style>
  :root{
    --bg1:#07131f; --bg2:#0d2a2e; --red:#e63946; --red2:#ff6b6b; --gold:#f4c95d; --green:#2ecc8f;
    --card:rgba(255,255,255,.06); --line:rgba(255,255,255,.14); --text:#f3f7fa; --muted:#9fb3c2;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--text);
    background:radial-gradient(1200px 700px at 15% -10%,#1b3a4d 0%,transparent 60%),
               radial-gradient(900px 600px at 100% 10%,#3a1520 0%,transparent 55%),
               linear-gradient(180deg,var(--bg1),var(--bg2));
    background-attachment:fixed;min-height:100vh;overflow-x:hidden;
  }
  #snow{position:fixed;inset:0;pointer-events:none;z-index:2}

  /* FONDO NAVIDEÑO DEL HERO */
  header.hero{isolation:isolate;min-height:94vh}
  .hero-inner{position:relative;z-index:3}
  .scroll-hint{z-index:3}
  .scenery{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;
    background:radial-gradient(60% 40% at 18% 100%,rgba(255,170,90,.16),transparent 70%),linear-gradient(180deg,#02040c 0%,#06112a 34%,#0e2842 66%,#27475f 88%,#3a586f 100%);
    -webkit-mask-image:linear-gradient(180deg,#000 82%,transparent);mask-image:linear-gradient(180deg,#000 82%,transparent)}
  .aurora{position:absolute;top:0;width:46%;height:48%;filter:blur(30px);mix-blend-mode:screen;opacity:.5;transform-origin:50% 100%;
    background:linear-gradient(180deg,transparent,rgba(60,255,170,.38) 38%,rgba(80,200,255,.16) 72%,transparent)}
  .a1{left:4%;transform:skewX(-18deg);animation:aur 11s ease-in-out infinite alternate}
  .a2{left:38%;width:36%;opacity:.32;transform:skewX(14deg);animation:aur 15s ease-in-out infinite alternate-reverse}
  @keyframes aur{from{opacity:.18;transform:skewX(-18deg) scaleY(.85) translateX(-3%)}to{opacity:.55;transform:skewX(-8deg) scaleY(1.1) translateX(5%)}}
  .milky{position:absolute;left:-20%;top:14%;width:140%;height:20%;transform:rotate(-24deg);filter:blur(22px);
    background:linear-gradient(180deg,transparent,rgba(170,190,255,.11) 45%,rgba(255,225,200,.07) 55%,transparent)}
  .stars i{position:absolute;border-radius:50%;animation:star 3s ease-in-out infinite}
  @keyframes star{0%,100%{opacity:.25}50%{opacity:1}}
  .moon{position:absolute;right:11%;top:15%;width:104px;height:104px;border-radius:50%;filter:blur(.4px);
    background:radial-gradient(circle at 30% 36%,rgba(110,112,125,.34) 0 9%,transparent 10%),radial-gradient(circle at 63% 27%,rgba(110,112,125,.3) 0 12%,transparent 13%),
      radial-gradient(circle at 56% 63%,rgba(105,108,122,.28) 0 14%,transparent 15%),radial-gradient(circle at 25% 69%,rgba(105,108,122,.2) 0 7%,transparent 8%),
      radial-gradient(circle at 36% 30%,#fffef6,#f1eedf 55%,#c9c5b3 100%);
    box-shadow:0 0 40px 10px rgba(235,240,255,.34),0 0 120px 40px rgba(170,195,255,.17),0 0 260px 110px rgba(120,150,255,.09)}
  .cloud{position:absolute;height:26px;border-radius:50%;filter:blur(9px);background:rgba(18,28,58,.55);animation:cl linear infinite}
  .c1{top:calc(15% + 28px);width:240px;right:-300px;animation-duration:70s}
  .c2{top:calc(15% + 60px);width:320px;right:-400px;height:20px;animation-duration:95s;animation-delay:-40s}
  .c3{top:calc(15% - 6px);width:180px;right:-260px;height:18px;animation-duration:80s;animation-delay:-18s}
  @keyframes cl{to{transform:translateX(-135vw)}}
  .santa{position:absolute;top:0;left:0;width:190px;animation:fly 40s linear infinite;filter:drop-shadow(0 0 5px rgba(190,205,255,.45))}
  .santa svg{display:block;animation:bob2 2.4s ease-in-out infinite alternate}
  @keyframes bob2{from{transform:translateY(-4px) rotate(-1.5deg)}to{transform:translateY(5px) rotate(1.5deg)}}
  @keyframes fly{0%{transform:translate(-260px,34vh) rotate(-6deg)}12%{transform:translate(45vw,24vh) rotate(-3deg)}23%{transform:translate(84vw,18vh) rotate(-1deg)}30%,100%{transform:translate(calc(100vw + 40px),9vh) rotate(3deg)}}
  .lyr{position:absolute;left:0;display:block;overflow:visible}
  .sw{transform-box:fill-box;transform-origin:50% 100%;animation:sway 6s ease-in-out infinite alternate}
  @keyframes sway{from{transform:rotate(-.8deg)}to{transform:rotate(.8deg)}}
  .fog{position:absolute;left:-20%;width:140%;height:110px;pointer-events:none;filter:blur(12px);
    background:radial-gradient(ellipse at 50% 50%,rgba(190,215,235,.26),transparent 70%);animation:fogm 45s ease-in-out infinite alternate}
  @keyframes fogm{from{transform:translateX(-5%)}to{transform:translateX(5%)}}
  .gl{animation:fl 3.2s ease-in-out infinite;mix-blend-mode:screen}
  @keyframes fl{0%,100%{opacity:.7}50%{opacity:1}}
  .win{animation:win 4s ease-in-out infinite alternate}
  @keyframes win{from{opacity:.8}to{opacity:1}}
  .smoke{position:absolute;width:14px;height:14px;border-radius:50%;background:rgba(205,215,230,.4);filter:blur(5px);animation:smoke 6s ease-out infinite}
  @keyframes smoke{0%{transform:translate(0,0) scale(.6);opacity:0}20%{opacity:.5}100%{transform:translate(22px,-80px) scale(2.8);opacity:0}}
  .garland{position:absolute;left:0;top:0;width:100%;height:120px}
  main{position:relative;z-index:1}

  /* HERO */
  header.hero{min-height:88vh;display:grid;place-items:center;text-align:center;padding:60px 20px 30px;position:relative}
  .badge{display:inline-flex;gap:8px;align-items:center;padding:8px 18px;border:1px solid var(--line);border-radius:99px;
    background:var(--card);backdrop-filter:blur(10px);font-size:.85rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);
    animation:drop .9s var(--ease) both}
  h1{font-size:clamp(2.6rem,8vw,6rem);line-height:1;margin:26px 0 18px;font-weight:800;letter-spacing:-.03em}
  h1 span{display:inline-block;opacity:0;transform:translateY(40px) rotate(4deg);animation:letter .8s var(--ease) forwards}
  h1 .grad span{background:linear-gradient(90deg,var(--red2),var(--gold),var(--red2));background-size:300% auto;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:letter .8s var(--ease) forwards,shine 5s linear infinite}
  .hero p{max-width:560px;margin:0 auto 34px;color:var(--muted);font-size:1.15rem;line-height:1.6;animation:drop 1s .5s var(--ease) both}
  .btn{display:inline-flex;align-items:center;gap:10px;border:0;cursor:pointer;font:inherit;font-weight:700;color:#fff;
    padding:16px 32px;border-radius:14px;background:linear-gradient(135deg,var(--red),#b5172a);
    box-shadow:0 10px 30px -8px rgba(230,57,70,.7);transition:transform .3s var(--ease),box-shadow .3s;text-decoration:none;position:relative;overflow:hidden}
  .btn:hover{transform:translateY(-3px);box-shadow:0 16px 36px -8px rgba(230,57,70,.85)}
  .btn:active{transform:scale(.97)}
  .btn::after{content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);transition:left .7s}
  .btn:hover::after{left:140%}
  .btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
  .scroll-hint{position:absolute;bottom:26px;left:50%;width:26px;height:42px;border:2px solid var(--line);border-radius:20px;transform:translateX(-50%)}
  .scroll-hint::after{content:"";position:absolute;left:50%;top:8px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:var(--gold);animation:wheel 1.6s infinite}
  .float{position:absolute;font-size:2.6rem;opacity:.9;animation:bob 6s ease-in-out infinite;filter:drop-shadow(0 8px 12px rgba(0,0,0,.4))}

  /* SECTIONS */
  section{max-width:1150px;margin:0 auto;padding:70px 20px}
  .sec-title{text-align:center;margin-bottom:46px}
  .sec-title h2{font-size:clamp(1.9rem,4vw,2.8rem);letter-spacing:-.02em}
  .sec-title p{color:var(--muted);margin-top:10px}
  .reveal{opacity:0;transform:translateY(50px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
  .reveal.in{opacity:1;transform:none}

  /* CARDS */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:28px;perspective:1200px}
  .card{position:relative;border-radius:26px;padding:34px 28px 28px;background:var(--card);border:1px solid var(--line);
    backdrop-filter:blur(14px);cursor:pointer;overflow:hidden;transform-style:preserve-3d;
    transition:transform .25s ease-out,border-color .4s,box-shadow .4s;--c:var(--red)}
  .card:nth-child(2){--c:#4dabf7}.card:nth-child(3){--c:var(--gold)}
  .card::before{content:"";position:absolute;inset:0;background:radial-gradient(400px circle at var(--mx,50%) var(--my,0%),color-mix(in srgb,var(--c) 28%,transparent),transparent 60%);opacity:0;transition:opacity .4s}
  .card:hover{border-color:color-mix(in srgb,var(--c) 70%,transparent);box-shadow:0 30px 60px -25px var(--c)}
  .card:hover::before{opacity:1}
  .card>*{position:relative}
  .icon{font-size:4rem;display:inline-block;transition:transform .5s var(--ease);transform:translateZ(40px)}
  .card:hover .icon{transform:translateZ(60px) scale(1.15) rotate(-8deg)}
  .card h3{font-size:1.65rem;margin:14px 0 8px}
  .card p{color:var(--muted);line-height:1.55;font-size:.97rem}
  .meta{display:flex;gap:14px;flex-wrap:wrap;margin:18px 0;font-size:.85rem;color:var(--muted)}
  .meta b{color:var(--text);font-weight:600}
  .bar{height:8px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
  .bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 50%,#fff));transition:width 1.4s var(--ease)}
  .spots{display:flex;justify-content:space-between;font-size:.85rem;margin:10px 0 20px;color:var(--muted)}
  .card .go{display:flex;align-items:center;justify-content:space-between;font-weight:700;color:var(--c)}
  .card .go svg{transition:transform .3s var(--ease)}
  .card:hover .go svg{transform:translateX(8px)}

  /* DETAIL MODAL */
  .overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:18px;background:rgba(3,8,14,.7);backdrop-filter:blur(8px);
    opacity:0;pointer-events:none;transition:opacity .4s}
  .overlay.open{opacity:1;pointer-events:auto}
  .modal{width:min(960px,100%);max-height:94vh;overflow:auto;border-radius:28px;background:linear-gradient(160deg,#102a36,#0a1822);
    border:1px solid var(--line);box-shadow:0 40px 100px -20px rgba(0,0,0,.8);display:grid;grid-template-columns:1fr 1.05fr;
    transform:translateY(60px) scale(.94);opacity:0;transition:transform .6s var(--ease),opacity .5s;--c:var(--red)}
  .overlay.open .modal{transform:none;opacity:1}
  .m-info{padding:42px 36px;background:radial-gradient(500px 400px at 0 0,color-mix(in srgb,var(--c) 35%,transparent),transparent 70%);border-right:1px solid var(--line)}
  .m-info .icon{font-size:5rem;transform:none;animation:bob 4s ease-in-out infinite}
  .m-info h3{font-size:2.1rem;margin:12px 0}
  .m-info p{color:var(--muted);line-height:1.6}
  .m-info ul{list-style:none;margin:22px 0}
  .m-info li{padding:10px 0;border-bottom:1px dashed var(--line);display:flex;gap:12px;font-size:.95rem;opacity:0;transform:translateX(-20px)}
  .overlay.open .m-info li{animation:slideIn .6s var(--ease) forwards}
  .overlay.open .m-info li:nth-child(1){animation-delay:.25s}.overlay.open .m-info li:nth-child(2){animation-delay:.35s}
  .overlay.open .m-info li:nth-child(3){animation-delay:.45s}.overlay.open .m-info li:nth-child(4){animation-delay:.55s}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .chip{padding:6px 12px;border-radius:99px;font-size:.82rem;background:rgba(255,255,255,.08);border:1px solid var(--line);animation:pop .5s var(--ease) both}
  .m-form{padding:42px 36px;position:relative}
  .close{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:1.3rem;cursor:pointer;transition:transform .4s var(--ease),background .3s;z-index:2}
  .close:hover{transform:rotate(90deg);background:rgba(255,255,255,.14)}
  .m-form h4{font-size:1.4rem;margin-bottom:6px}
  .m-form .sub{color:var(--muted);font-size:.92rem;margin-bottom:24px}
  .field{position:relative;margin-bottom:18px}
  .field input,.field select{width:100%;padding:22px 16px 8px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);font:inherit;outline:none;transition:border-color .3s,box-shadow .3s,background .3s}
  .field select option{color:#000}
  .field label{position:absolute;left:16px;top:16px;color:var(--muted);pointer-events:none;transition:all .25s var(--ease);font-size:1rem}
  .field input:focus,.field select:focus{border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 25%,transparent);background:rgba(255,255,255,.08)}
  .field input:focus+label,.field input:not(:placeholder-shown)+label,.field select+label{top:6px;font-size:.72rem;color:var(--c);letter-spacing:.05em}
  .field.err input{border-color:var(--red2);animation:shake .4s}
  .err-msg{color:var(--red2);font-size:.78rem;margin-top:5px;display:none}
  .field.err .err-msg{display:block}
  .m-form .btn{width:100%;justify-content:center;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#000))}
  .full{padding:14px;border-radius:14px;background:rgba(230,57,70,.15);border:1px solid var(--red);text-align:center;color:var(--red2)}
  .success{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;background:linear-gradient(160deg,#102a36,#0a1822);opacity:0;pointer-events:none;transition:opacity .5s;border-radius:0 28px 28px 0}
  .success.show{opacity:1;pointer-events:auto}
  .check{width:96px;height:96px;margin:0 auto 20px}
  .check circle{fill:none;stroke:var(--green);stroke-width:4;stroke-dasharray:290;stroke-dashoffset:290}
  .check path{fill:none;stroke:var(--green);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60}
  .success.show .check circle{animation:draw .8s .1s ease forwards}
  .success.show .check path{animation:draw .5s .7s ease forwards}
  .success h4{font-size:1.7rem;margin-bottom:8px}
  .success p{color:var(--muted);margin-bottom:22px;line-height:1.5}
  .btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none}

  footer{text-align:center;padding:50px 20px 60px;color:var(--muted);font-size:.9rem;position:relative;z-index:1}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:100}

  /* ESCENAS ANIMADAS */
  .scene{aspect-ratio:300/170;border-radius:18px;overflow:hidden;margin-bottom:18px;border:1px solid var(--line);
    background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--c) 38%,#0a1822),#0a1822 75%);transform:translateZ(30px)}
  .scene{position:relative}
  .scene svg{display:block;width:100%;height:100%}
  .scene video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.04);transition:transform 1.2s var(--ease),filter .6s;filter:saturate(1.05) brightness(.92)}
  .card:hover .scene video{transform:scale(1.14);filter:saturate(1.2) brightness(1.02)}
  .scene::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,transparent 45%,rgba(7,19,31,.75)),linear-gradient(135deg,color-mix(in srgb,var(--c) 28%,transparent),transparent 55%)}
  .scene .tag{position:absolute;left:12px;bottom:10px;z-index:2;display:flex;align-items:center;gap:7px;font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#fff}
  .scene .tag i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 0 0 var(--c);animation:rec 1.6s infinite}
  @keyframes rec{70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
  .m-info .scene{margin-bottom:16px;transform:none}
  /* fútbol sala (ciclo 3.6s) */
  .fs-leg{transform-origin:70px 100px;animation:fsLeg 3.6s infinite}
  .fs-bx{animation:fsBx 3.6s infinite}
  .fs-by{animation:fsBy 3.6s infinite}
  .fs-bs{transform-origin:106px 131px;animation:fsSpin 3.6s infinite}
  .fs-ball{animation:fsFade 3.6s infinite}
  .fs-net{transform-origin:252px 100px;animation:fsNet 3.6s infinite}
  .fs-gol{transform-origin:190px 48px;animation:fsGol 3.6s infinite}
  @keyframes fsLeg{0%,8%{transform:rotate(0)}22%{transform:rotate(38deg)}34%{transform:rotate(-62deg)}46%{transform:rotate(-8deg)}60%,100%{transform:rotate(0)}}
  @keyframes fsBx{0%,34%{transform:translateX(0);animation-timing-function:linear}62%{transform:translateX(164px);animation-timing-function:ease-out}80%,100%{transform:translateX(176px)}}
  @keyframes fsBy{0%,34%{transform:translateY(0);animation-timing-function:ease-out}46%{transform:translateY(-48px);animation-timing-function:ease-in}62%{transform:translateY(-4px)}70%,100%{transform:translateY(0)}}
  @keyframes fsSpin{0%,34%{transform:rotate(0)}80%,100%{transform:rotate(720deg)}}
  @keyframes fsFade{0%,92%{opacity:1}99%,100%{opacity:0}}
  @keyframes fsNet{0%,60%{transform:scaleX(1)}68%{transform:scaleX(1.2)}78%{transform:scaleX(.96)}88%,100%{transform:scaleX(1)}}
  @keyframes fsGol{0%,60%{opacity:0;transform:scale(.3)}68%{opacity:1;transform:scale(1.3)}75%{transform:scale(1)}90%{opacity:1;transform:scale(1)}98%,100%{opacity:0;transform:scale(1)}}
  /* videojuegos */
  .vg-en{animation:vgEn 2.4s ease-in-out infinite}
  .vg-ship{animation:vgShip 3.2s ease-in-out infinite}
  .vg-bul{animation:vgBul .8s linear infinite}
  .vg-hit{transform-origin:154px 44px;animation:vgHit .8s linear infinite}
  .vg-b1,.vg-b2,.vg-blink{animation:vgBtn .7s steps(1) infinite}
  .vg-b2{animation-delay:.35s}
  .vg-blink{animation-duration:1s}
  @keyframes vgEn{0%,100%{transform:translateX(-14px)}50%{transform:translateX(14px)}}
  @keyframes vgShip{0%,100%{transform:translateX(0)}50%{transform:translateX(86px)}}
  @keyframes vgBul{0%{transform:translateY(0);opacity:1}80%{transform:translateY(-58px);opacity:1}100%{transform:translateY(-62px);opacity:0}}
  @keyframes vgHit{0%,78%{opacity:0;transform:scale(.2)}90%{opacity:1;transform:scale(1.4)}100%{opacity:0;transform:scale(1.8)}}
  @keyframes vgBtn{0%{opacity:1}50%{opacity:.25}}
  /* tenis de mesa (ciclo 2.8s, la pelota cruza en 1.4s) */
  .tt-bx{animation:ttBx 1.4s linear infinite alternate}
  .tt-by{animation:ttBy 1.4s infinite}
  .tt-pl{transform-origin:22px 100px;animation:ttL 2.8s infinite}
  .tt-pr{transform-origin:278px 100px;animation:ttR 2.8s infinite;animation-delay:-1.4s}
  @keyframes ttBx{from{transform:translateX(0)}to{transform:translateX(232px)}}
  @keyframes ttBy{0%{transform:translateY(0);animation-timing-function:ease-out}25%{transform:translateY(-32px);animation-timing-function:ease-in}65%{transform:translateY(16px);animation-timing-function:ease-out}100%{transform:translateY(0)}}
  @keyframes ttL{0%{transform:rotate(25deg)}12%,85%{transform:rotate(0)}95%{transform:rotate(-35deg)}100%{transform:rotate(25deg)}}
  @keyframes ttR{0%{transform:rotate(-25deg)}12%,85%{transform:rotate(0)}95%{transform:rotate(35deg)}100%{transform:rotate(-25deg)}}

  @keyframes drop{from{opacity:0;transform:translateY(-24px)}to{opacity:1;transform:none}}
  @keyframes letter{to{opacity:1;transform:none}}
  @keyframes shine{to{background-position:200% center}}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-18px) rotate(5deg)}}
  @keyframes wheel{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(16px)}}
  @keyframes slideIn{to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}

  @media(max-width:820px){
    .modal{grid-template-columns:1fr}
    .m-info{border-right:0;border-bottom:1px solid var(--line);padding:30px 24px}
    .m-form{padding:30px 24px}
    .success{border-radius:0 0 28px 28px}
    .float{display:none}
  }
  @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="snow"></canvas>
<canvas id="confetti"></canvas>

<main>
  <header class="hero">
    <div class="scenery" aria-hidden="true">
      <div class="aurora a1"></div><div class="aurora a2"></div>
      <div class="milky"></div>
      <div class="stars" id="stars"></div>
      <div class="moon"></div>
      <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
      <div class="santa">
        <svg viewBox="0 0 230 70" width="190" xmlns="http://www.w3.org/2000/svg">

    el.addEventListener('click',()=>openModal(a));
    el.addEventListener('keydown',e=>{if(e.key==='Enter')openModal(a)});
    // 3D tilt + glow
    el.addEventListener('mousemove',e=>{const r=el.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
      el.style.setProperty('--mx',x+'px');el.style.setProperty('--my',y+'px');
      el.style.transition='transform .1s';
      el.style.transform=`rotateX(${(.5-y/r.height)*10}deg) rotateY(${(x/r.width-.5)*12}deg) translateY(-6px)`});
    el.addEventListener('mouseleave',()=>{el.style.transition='';el.style.transform=''});
    grid.appendChild(el);io.observe(el);
  });
}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');
  const b=e.target.querySelector('.bar i');if(b)setTimeout(()=>b.style.width=b.dataset.w+'%',300);io.unobserve(e.target)}}),{threshold:.2});

function closeModal(){overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');document.body.style.overflow=''}
overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal()});
addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function submit(e){
  e.preventDefault();
  const v={n:fn.value.trim(),e:fe.value.trim(),t:ft.value.trim(),a:fa.value};
  const rules={fn:v.n.split(/\s+/).filter(Boolean).length>=1&&v.n.length>=3,fe:/^\S+@\S+\.\S+$/.test(v.e),ft:v.t.replace(/\D/g,'').length>=9,fa:!!v.a};
  let ok=true;Object.entries(rules).forEach(([id,good])=>{const f=document.getElementById(id).parentNode;f.classList.remove('err');
    if(!good){ok=false;void f.offsetWidth;f.classList.add('err')}});
  if(!ok)return;
  const list=db[current.id];
  if(list.length>=current.cap)return;
  if(list.some(p=>p.email===v.e.toLowerCase())){const f=fe.parentNode;f.classList.add('err');f.querySelector('.err-msg').textContent='Este correo ya está inscrito';return}
  list.push({name:v.n,email:v.e.toLowerCase(),phone:v.t,age:v.a,date:new Date().toISOString()});
  save(db);
  document.getElementById('okMsg').innerHTML=`Gracias, <b>${esc(v.n.split(' ')[0])}</b>. Te esperamos en <b>${current.name}</b> ${current.icon}`;
  document.getElementById('ok').classList.add('show');
  document.getElementById('okClose').onclick=()=>{closeModal();renderCards();document.querySelectorAll('.card').forEach(c=>{c.classList.add('in');const b=c.querySelector('.bar i');b.style.width=b.dataset.w+'%'})};
  burst(current.color);
}

// ===== Paisaje navideño realista =====
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function buildScenery(){
  const W=Math.max(320,document.querySelector('header.hero').clientWidth),S=Math.min(1,Math.max(.55,W/1300));
  const rng=mulberry(2026),R=(a,b)=>a+rng()*(b-a),f1=n=>n.toFixed(1);
  // estrellas
  const st=document.getElementById('stars');st.innerHTML='';
  for(let i=0;i<150;i++){const big=rng()<.12,z=big?R(1.8,2.6):R(.6,1.5),c=['#fff','#cfe0ff','#ffe9cf','#fff'][rng()*4|0];
    st.insertAdjacentHTML('beforeend',`<i style="left:${f1(R(0,100))}%;top:${f1(R(0,64))}%;width:${z}px;height:${z}px;background:${c};${big?`box-shadow:0 0 5px ${c};`:''}animation-delay:${-R(0,4).toFixed(1)}s;animation-duration:${R(2,6).toFixed(1)}s;opacity:${R(.3,1).toFixed(2)}"></i>`)}
  // terreno
  function terrain(base,amp,ridged){const ph=[R(0,6),R(0,6),R(0,6)],fq=[.0042,.011,.027],am=[.55,.3,.15];
    const yAt=x=>{let v=0;for(let k=0;k<3;k++){const q=Math.sin(x*fq[k]*(ridged?1.3:1)+ph[k]);v+=am[k]*(ridged?1-Math.abs(q):(q+1)/2)}return base-amp*v};
    let d='M0,'+f1(yAt(0));for(let x=6;x<=W+6;x+=6)d+=`L${x},${f1(yAt(x))}`;return{yAt,d}}
  // abeto con ramas irregulares
  function pine(h){const w=h*.5,n=Math.max(5,Math.round(h/18)+3),tH=h*.88/n,hws=[],ys=[];
    const side=g=>{const p=[];for(let i=0;i<n;i++){const t=(i+1)/n,yt=-h+i*tH*.82,yb=Math.min(yt+tH*1.9,-h*.07),hw=w/2*(.16+.84*t)*R(.88,1.08);
      p.push([g*hw*.55+R(-1,1)*hw*.04,(yt+yb)/2],[g*hw,yb+R(0,3)],[g*hw*.4,yb-tH*.32]);if(g>0){hws.push(hw);ys.push([yt,yb])}}return p};
    const rp=side(1),lp=side(-1);let d=`M0,${-h}`;rp.forEach(q=>d+=`L${f1(q[0])},${f1(q[1])}`);
    d+=`L${f1(w*.05)},${f1(-h*.07)}L${f1(w*.05)},0L${f1(-w*.05)},0L${f1(-w*.05)},${f1(-h*.07)}`;
    for(let i=lp.length-1;i>=0;i--)d+=`L${f1(lp[i][0])},${f1(lp[i][1])}`;d+='Z';
    let sn='';ys.forEach(([yt,yb],i)=>{const hw=hws[i],y=k=>f1(yt+(yb-yt)*k);
      sn+=`M0,${f1(yt)}L${f1(hw*.6)},${y(.62)}L${f1(hw*.36)},${y(.52)}L0,${y(.22)}L${f1(-hw*.36)},${y(.52)}L${f1(-hw*.6)},${y(.62)}Z`});
    return{d,sn,w}}
  function lights(h,w,op){let o='';const N=Math.round(h/7);for(let k=0;k<N;k++){const t=k/N,y=-h*.93+t*h*.82,hw=w/2*(.16+.84*(y+h)/h)*.82,x=Math.sin(k*1.25)*hw;
      const c=['#ffd79a','#ffe9c4','#ff9a8a','#9ad6ff'][k%4];
      o+=`<circle class="gl" cx="${f1(x)}" cy="${f1(y)}" r="${op}" fill="${c}" style="animation-delay:${-R(0,3).toFixed(1)}s;animation-duration:${R(2,4.5).toFixed(1)}s"/><circle cx="${f1(x)}" cy="${f1(y)}" r="${op*.45}" fill="#fff"/>`}return o}
  // capas
  function layer(o){const T=terrain(o.base,o.amp*S,o.ridged);let t='';
    if(o.count){const xs=Array.from({length:o.count},(_,i)=>(i+R(.1,.9))/o.count*W).filter(x=>!(o.skip&&Math.abs(x-o.skip)<o.skipW));
      xs.forEach(x=>{const h=R(o.h[0],o.h[1])*S,tr=pine(h),y=T.yAt(x)+3,sw=o.sway?` class="sw" style="animation-delay:${-R(0,6).toFixed(1)}s;animation-duration:${R(5,8).toFixed(1)}s"`:'';
        t+=`<g transform="translate(${f1(x)},${f1(y)})"><g${sw}><path d="${tr.d}" fill="url(#t-${o.id})"/><path d="${tr.sn}" fill="rgba(228,240,252,${o.snow})"/>${o.lights&&rng()<o.lights?lights(h,tr.w,Math.max(1.3,h/110)):''}</g></g>`})}
    const html=`<svg class="lyr" style="bottom:${o.bottom}px;height:${o.LH}px;${o.blur?`filter:blur(${o.blur}px)`:''}" width="${W}" height="${o.LH}" viewBox="0 0 ${W} ${o.LH}">
      <defs><linearGradient id="g-${o.id}" x1="0" y1="0" x2="0" y2="1">${o.stops.map((c,i)=>`<stop offset="${o.at[i]}" stop-color="${c}"/>`).join('')}</linearGradient>
      <linearGradient id="t-${o.id}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${o.tree[1]}"/><stop offset="1" stop-color="${o.tree[0]}"/></linearGradient></defs>
      <path d="${T.d}L${W},${o.LH}L0,${o.LH}Z" fill="url(#g-${o.id})"/><path d="${T.d}" fill="none" stroke="rgba(215,232,255,${o.rim})" stroke-width="1.4"/>${t}</svg>`;
    return{html,T}}
  const mount=layer({id:'m',LH:300,bottom:140,base:240,amp:150,ridged:true,stops:['#7396b6','#3b5b79','#1b3249'],at:[0,.35,1],rim:.55,blur:.6,tree:['#1d3d52','#14303f'],snow:0});
  const far=layer({id:'f',LH:220,bottom:105,base:150,amp:55,stops:['#3d6079','#1d394f'],at:[0,1],rim:.35,blur:.6,count:Math.round(W/20),h:[45,80],tree:['#2b536e','#183548'],snow:.18});
  const cabinX=W*.15;
  const mid=layer({id:'d',LH:240,bottom:58,base:150,amp:60,stops:['#2b4b64','#112a3a'],at:[0,1],rim:.45,count:Math.round(W/36),h:[90,150],tree:['#17414d','#0b2630'],snow:.26,sway:true,skip:cabinX,skipW:70*S});
  const near=layer({id:'n',LH:260,bottom:0,base:175,amp:50,stops:['#86a6c0','#42647d','#14293a'],at:[0,.25,1],rim:.7,count:Math.round(W/85),h:[170,290],tree:['#0f2f33','#05161a'],snow:.38,sway:true,lights:.4});
  // cabaña con ventanas cálidas y humo
  const cy=mid.T.yAt(cabinX),k=1.25*S+.15,cbot=58+(240-cy)-2,cw=60*k;
  const cabin=`<svg class="lyr" style="left:${f1(cabinX-cw/2)}px;bottom:${f1(cbot)}px;width:${f1(cw)}px;height:${f1(46*k)}px" viewBox="0 0 60 46">
    <defs><radialGradient id="wg"><stop offset="0" stop-color="#ffd98a"/><stop offset="1" stop-color="#ff9a3c"/></radialGradient></defs>
    <rect x="6" y="18" width="48" height="26" fill="#1c1510"/><rect x="40" y="4" width="7" height="14" fill="#1c1510"/><rect x="39" y="2.5" width="9" height="3" fill="#dce8f3"/>
    <polygon points="0,21 30,2 60,21 54,21 30,8 6,21" fill="#251b14"/><polygon points="1,21 30,3 59,21 53,21 30,9 7,21" fill="#e2edf7"/>
    <g class="win"><rect x="13" y="26" width="11" height="10" fill="url(#wg)"/><rect x="36" y="26" width="11" height="10" fill="url(#wg)"/>
    <circle cx="18.5" cy="31" r="14" fill="#ffb347" opacity=".22" style="mix-blend-mode:screen"/><circle cx="41.5" cy="31" r="14" fill="#ffb347" opacity=".22" style="mix-blend-mode:screen"/></g>
    <rect x="27" y="30" width="6" height="14" fill="#0e0a07"/></svg>
    ${[0,2,4].map(d=>`<span class="smoke" style="left:${f1(cabinX+cw*.22)}px;bottom:${f1(cbot+46*k*.86)}px;animation-delay:${-d}s"></span>`).join('')}`;
  // guirnalda con bombillas de cristal
  const COL=[['#ff9a9a','#e8323f','#7a0c18'],['#fff1b0','#ffc83d','#9a6a00'],['#bdeaff','#3fb4ee','#0b4f7a'],['#c4ffd8','#35d07a','#0b5a30'],['#ffd0f0','#e060c0','#6e1a5a']];
  const seg=Math.ceil(W/260),sw=W/seg,sag=38;let d='M0 6',b='',defs='';
  COL.forEach((c,i)=>defs+=`<radialGradient id="gb${i}" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="${c[0]}"/><stop offset=".45" stop-color="${c[1]}"/><stop offset="1" stop-color="${c[2]}"/></radialGradient>
    <radialGradient id="gg${i}"><stop offset="0" stop-color="${c[1]}" stop-opacity=".6"/><stop offset="1" stop-color="${c[1]}" stop-opacity="0"/></radialGradient>`);
  for(let q=0;q<seg;q++){const x0=q*sw,x1=x0+sw,cx=x0+sw/2;d+=`Q${f1(cx)} ${6+sag*2} ${f1(x1)} 6`;
    for(let m=1;m<=6;m++){const t=m/7,px=(1-t)*(1-t)*x0+2*(1-t)*t*cx+t*t*x1,py=(1-t)*(1-t)*6+2*(1-t)*t*(6+sag*2)+t*t*6,i=(q*6+m)%5;
      b+=`<g transform="translate(${f1(px)},${f1(py)})"><circle class="gl" cy="12" r="19" fill="url(#gg${i})" style="animation-delay:${-R(0,3).toFixed(1)}s;animation-duration:${R(2.5,4.5).toFixed(1)}s"/>
        <rect x="-2.3" y="-1" width="4.6" height="6" rx="1" fill="#13231b"/><path d="M-4 5C-5 12-3.5 17 0 17C3.5 17 5 12 4 5Z" fill="url(#gb${i})"/><ellipse cx="-1.5" cy="9" rx=".9" ry="2.4" fill="#fff" opacity=".55"/></g>`}}
  const garland=`<div class="garland"><svg width="${W}" height="120" viewBox="0 0 ${W} 120" style="overflow:visible"><defs>${defs}</defs>
    <path d="${d}" fill="none" stroke="#0d1f17" stroke-width="2.4"/><path d="${d}" fill="none" stroke="rgba(120,160,130,.25)" stroke-width=".7" transform="translate(0,-1)"/>${b}</svg></div>`;
  const fog=y=>`<div class="fog" style="bottom:${y}px"></div>`;
  document.getElementById('dyn').innerHTML=mount.html+fog(150)+far.html+fog(95)+mid.html+cabin+fog(50)+near.html+garland;
}
buildScenery();
let rsT;addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(buildScenery,250)});

// Snow
const sc=document.getElementById('snow'),sx=sc.getContext('2d');let flakes=[];
function rs(){sc.width=innerWidth;sc.height=innerHeight;flakes=Array.from({length:Math.min(140,innerWidth/8)},()=>({x:Math.random()*sc.width,y:Math.random()*sc.height,r:Math.random()*2.8+.6,s:Math.random()*1+.3,d:Math.random()*Math.PI*2}))}
addEventListener('resize',rs);rs();
(function snow(){sx.clearRect(0,0,sc.width,sc.height);flakes.forEach(f=>{sx.fillStyle=`rgba(255,255,255,${(.3+f.r/3.4*.55).toFixed(2)})`;sx.shadowBlur=f.r>2?7:0;sx.shadowColor='#fff';f.y+=f.s;f.d+=.01;f.x+=Math.sin(f.d)*.5;if(f.y>sc.height){f.y=-5;f.x=Math.random()*sc.width}
    sx.beginPath();sx.arc(f.x,f.y,f.r,0,7);sx.fill()});requestAnimationFrame(snow)})();

// Confetti
const cc=document.getElementById('confetti'),cx=cc.getContext('2d');let parts=[];
function rc(){cc.width=innerWidth;cc.height=innerHeight}addEventListener('resize',rc);rc();
function burst(color){
  const cols=[color,'#f4c95d','#e63946','#2ecc8f','#ffffff','#4dabf7'];
  for(let i=0;i<160;i++){const a=Math.random()*Math.PI*2,v=Math.random()*14+4;
    parts.push({x:innerWidth/2,y:innerHeight/2,vx:Math.cos(a)*v,vy:Math.sin(a)*v-6,w:Math.random()*9+4,h:Math.random()*5+3,c:cols[i%cols.length],r:Math.random()*6,vr:Math.random()*.4-.2,life:1})}
}
(function conf(){cx.clearRect(0,0,cc.width,cc.height);
  parts=parts.filter(p=>p.life>0);
  parts.forEach(p=>{p.vy+=.35;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life-=.007;
    cx.save();cx.globalAlpha=Math.max(p.life,0);cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()});
  requestAnimationFrame(conf)})();

renderCards();
</script>
